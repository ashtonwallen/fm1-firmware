# POND's build settings (fm1-base's tools/build.py: ./build.sh)
name = "POND"                  # the build's files: pond.fwsc, pond-X.Y.fwsc
id_prefix = "FM-1_76"          # package identity: dev FM-1_7600, releases FM-1_76XXYYZZ
usb_manufacturer = "POND"
usb_product = "POND FM-1"      # must keep "FM-1": M-Flasher finds the unit by it
ble = false                    # never uses the radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine, at -O2
# the site
tagline = "Fish in a pond, singing"
repo = "https://github.com/ashtonwallen/fm1-firmware/tree/main/pond"
install = "https://github.com/ashtonwallen/fm1-firmware/releases"
screenshot = "docs/img/screen-pond.png"
licence = "MPL-2.0"
credits = "Built on AMB-1 by Charles Vestal, on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "ashtonwallen (built on AMB-1 by Charles Vestal)"
description = "POND turns the M-VAVE FM-1 into a pond of singing fish. Each fish has a name, a species (its voice), a temperament and a note. They swim, sing softly, meet and play chords, make friends and rivals, grow, have fry and grow old. Days and seasons pass; lily pads, frogs at night, a heron now and then. Keys drop food and add their note to the scale. Left alone it settles into quiet ripples, slow drones and the odd plip. AMB-1's engine underneath: pad, FM bells, gliding bass, tape echo, plate reverb. Thirteen presets recolour the sound."
tags = ["ambient", "generative", "game", "fm"]
