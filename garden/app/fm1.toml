# GARDEN's build settings (fm1-base's tools/build.py: ./build.sh). Built on AMB-1 by Charles Vestal.
name = "GARDEN"                # the build's files: garden.fwsc, garden-X.Y.fwsc
id_prefix = "FM-1_77"          # package identity: dev FM-1_7700, releases FM-1_77XXYYZZ
usb_manufacturer = "GARDEN"
usb_product = "GARDEN FM-1"    # must keep "FM-1": M-Flasher finds the unit by it
ble = false                    # never uses the radio
usb_audio_in = true            # the music recordable over USB (as AMB-1)
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine, at -O2
# the site
tagline = "A melody garden that plays itself, tended by a gardener"
repo = "https://github.com/ashtonwallen/fm1-firmware/tree/main/garden"
licence = "MPL-2.0"
credits = "Engine from AMB-1 by Charles Vestal. Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "ashtonwallen (built on AMB-1 by Charles Vestal)"
description = "GARDEN turns the FM-1 into a melody garden. Press a key and a seed goes in at that pitch. Over minutes it sprouts, grows a phrase in the garden's scale, flowers with bells, goes to seed on the plots around it, withers and leaves compost that hums. A named gardener with a mood waters, prunes and plants favourites. Bees cross flowers into hybrids, a rabbit nibbles sprouts, rain speeds everything up and frost takes the weak. Every plant has a name and parents, all kept across power-offs. Plays itself from power-on, on AMB-1's pad, bells, echo and plate reverb. Thirteen presets recolour the sound."
tags = ["ambient", "generative", "game", "experimental"]
install = "https://github.com/ashtonwallen/fm1-firmware/releases"
screenshot = "docs/img/screen-garden.png"
