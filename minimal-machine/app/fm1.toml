# MINIMAL MACHINE's build settings (fm1-base's tools/build.py: ./build.sh)
name = "MINIMAL"               # the build's files: minimal.fwsc, minimal-X.Y.fwsc
id_prefix = "FM-1_91"          # package identity: dev FM-1_9100, releases FM-1_91XXYYZZ
usb_manufacturer = "MINIMAL MACHINE"
usb_product = "MINIMAL MACHINE FM-1"
ble = false                    # the radio stays off
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/mm.c"]              # the engine, at -O2
# the site
tagline = "Endless minimal techno from phasing loops"
repo = "https://github.com/ashtonwallen/fm1-firmware/tree/main/minimal-machine"
licence = "MPL-2.0"
credits = "Built on AMB-1 by Charles Vestal, on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "ashtonwallen (built on AMB-1 by Charles Vestal)"
description = "MINIMAL MACHINE turns the M-VAVE FM-1 into endless minimal techno. Six short loops (a deep kick, soft hats, a rim or clap, a dub chord stab through a ping-pong echo, a sub bass and a small bleep) each run at their own length, so they phase against each other slowly. Every few bars one step or one sound mutates; it evolves without ever jumping. Twelve presets, four knobs that matter: Density, Drift, Filter, Echo."
tags = ["generative", "drum-machine", "groovebox", "fm"]
install = "https://github.com/ashtonwallen/fm1-firmware/releases"
screenshot = "docs/img/screen-machine.png"
