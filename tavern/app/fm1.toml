# TAVERN's build settings (fm1-base's tools/build.py: ./build.sh)
name = "TAVERN"                # the build's files: tavern.fwsc, tavern-X.Y.fwsc
id_prefix = "FM-1_81"          # package identity: dev FM-1_8100, releases FM-1_81XXYYZZ
usb_manufacturer = "TAVERN"         # the name the computer shows (and firmware.json's name)
usb_product = "TAVERN FM-1"    # keeps "FM-1": M-Flasher finds the unit by it
ble = false                    # never uses the radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine, at -O2
# the site
tagline = "Folk session in a tavern corner. Regulars come, play, trade tunes, go home."
repo = "https://github.com/ashtonwallen/fm1-firmware/tree/main/tavern"
licence = "MPL-2.0"
credits = "Built on AMB-1 by Charles Vestal, on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "ashtonwallen (built on AMB-1 by Charles Vestal)"
description = "TAVERN turns the M-VAVE FM-1 into a small folk session that plays all night by itself. Eight regulars with fiddles, a whistle, a harp, a lute, a box, a bass and a bodhran drift in and out of a tavern corner: one starts a tune, the others join on the phrase, sets run on into new keys, players trade parts, a visitor sits in, someone plays a lament. Tunes are generated in folk modes, reels and jigs in the busy middle of the night, slow airs late. Rain, wind, sea or the fire outside, each with its own level. The regulars and memorable nights are kept across power-offs."
tags = ["generative", "ambient", "game", "fm"]
install = "https://github.com/ashtonwallen/fm1-firmware/releases"
screenshot = "docs/img/screen-tavern.png"
