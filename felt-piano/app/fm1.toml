# FELT PIANO's build settings (fm1-base's tools/build.py: ./build.sh)
name = "FELTPIANO"             # the build's files: feltpiano.fwsc, feltpiano-X.Y.fwsc
id_prefix = "FM-1_96"          # package identity: dev FM-1_9600, releases FM-1_96XXYYZZ
usb_manufacturer = "FELT PIANO"
usb_product = "FELT PIANO FM-1"   # keeps "FM-1": M-Flasher finds the unit by it
ble = false                    # never uses the radio
usb_audio_in = true            # the music recordable over USB (at MASTER's level)
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/felt.c"]            # the engine, at -O2
# the site
tagline = "Endless generated solo piano. Felt hammers, a soft pedal, a quiet room."
repo = "https://github.com/ashtonwallen/fm1-firmware/tree/main/felt-piano"
licence = "MPL-2.0"
credits = "Built on AMB-1 by Charles Vestal, on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "ashtonwallen (built on AMB-1 by Charles Vestal)"
description = "FELT PIANO turns the M-VAVE FM-1 into an endless solo pianist. Every few minutes a new piece in one of eleven idioms: Gymnopedie-like waltz, Airport-style loops, felt ostinato, nocturne, modal improvising, Glass-style arpeggios, four-part hymn, slow stride ballad, Debussy-style planing, 6/8 lullaby or slow 12/8 blues. A modal felt-piano voice with soft hammers, dampers, sympathetic strings, pedal and key noise, in a gentle room; a piano roll scrolls on the screen. Thirty presets, from Erik's Bowler to Bent Nickel."
tags = ["generative", "ambient"]
install = "https://github.com/ashtonwallen/fm1-firmware/releases"
screenshot = "docs/img/screen-roll.png"
